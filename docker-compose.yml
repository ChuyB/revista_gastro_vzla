version: '3.8'

services:
  web:
    build: .
    container_name: revista_ojs_app
    restart: unless-stopped
    mem_limit: 380m
    mem_reservation: 200m
    environment:
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      REQUIRE_CLOUDFRONT: "${REQUIRE_CLOUDFRONT:-false}"
      BLOCK_RAW_IPS: "${BLOCK_RAW_IPS:-false}"
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./ojs_code:/var/www/html
      - ./ojs_files:/var/ojs/files
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: revista_ojs_db
    mem_limit: 300m
    mem_reservation: 150m
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ojsg}
      MYSQL_USER: ${MYSQL_USER:-ojs_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ojs_password}
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./init_db:/docker-entrypoint-initdb.d
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3306}:3306"
