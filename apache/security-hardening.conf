# ==============================================================================
# Apache Security Hardening & CloudFront Origin Validation
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MPM Prefork Worker & Concurrency Tuning
# ------------------------------------------------------------------------------
# Prevent container OOM crashes under concurrency against container memory limits
# (e.g. mem_limit: 380m). With ~25-30MB average RSS per PHP worker, 12 workers
# cap Apache memory usage safely around ~360MB.
<IfModule mpm_prefork_module>
    StartServers             3
    MinSpareServers          2
    MaxSpareServers          5
    MaxRequestWorkers       12
    MaxConnectionsPerChild 1000
</IfModule>

# ------------------------------------------------------------------------------
# 2. Server Information Concealment
# ------------------------------------------------------------------------------
# Suppress Apache version and operating system details in HTTP response headers
ServerTokens Prod
# Disable server version signature footer on server-generated pages
ServerSignature Off

# ------------------------------------------------------------------------------
# 2.1. Performance & Latency Optimizations
# ------------------------------------------------------------------------------
# Strictly prevent Apache from performing reverse DNS lookups on client IP addresses (avoid 10s DNS delays)
HostnameLookups Off

# Enable persistent connections (keep-alive) to improve performance and reduce latency.
# KeepAliveTimeout 15 keeps Apache's timeout higher than CloudFront's default 5s origin keep-alive,
# preventing race condition drops where Apache closes the TCP socket as CloudFront forwards a request.
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 15

# Disable .htaccess overrides for security and performance (eliminates disk stat calls for .htaccess on every request).
<Directory /var/www/>
    AllowOverride None
</Directory>

# ------------------------------------------------------------------------------
# 3. Client Real IP Restoration (mod_remoteip)
# ------------------------------------------------------------------------------
# Restore original client IP address forwarded by reverse proxies (CloudFront / Docker)
<IfModule remoteip_module>
    RemoteIPHeader X-Forwarded-For
    # Trust standard Docker bridge networks and localhost
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16
    RemoteIPInternalProxy 127.0.0.1
    RemoteIPInternalProxy ::1
</IfModule>

# ------------------------------------------------------------------------------
# 4. Forwarded Protocol / HTTPS Detection
# ------------------------------------------------------------------------------
# CloudFront terminates SSL and forwards "X-Forwarded-Proto: https" and/or
# "CloudFront-Forwarded-Proto: https".
# Signal to PHP that the request arrived over HTTPS so $_SERVER['HTTPS'] is "on".
<IfModule setenvif_module>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    SetEnvIf CloudFront-Forwarded-Proto "^https$" HTTPS=on
</IfModule>

# ------------------------------------------------------------------------------
# 5. HTTP Security Headers (mod_headers)
# ------------------------------------------------------------------------------
<IfModule headers_module>
    # Prevent browsers from MIME-sniffing away from the declared content-type
    Header always set X-Content-Type-Options "nosniff"
    # Protect against clickjacking by disallowing cross-origin framing
    Header always set X-Frame-Options "SAMEORIGIN"
    # Send referrer only for same-origin or cross-origin HTTPS requests
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# ------------------------------------------------------------------------------
# 6. Slowloris & Slow HTTP DDoS Mitigation (mod_reqtimeout)
# ------------------------------------------------------------------------------
<IfModule reqtimeout_module>
    # Mitigate slowloris and slow POST DDoS attacks:
    # 20s initial timeout for request headers (min rate 500 B/s, max 40s),
    # 20s timeout for request body (min rate 500 B/s).
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# ------------------------------------------------------------------------------
# 7. Sensitive File Protection
# ------------------------------------------------------------------------------
# Deny access to hidden files and directories (.git, .env, .htaccess, etc.)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<DirectoryMatch "(^|/)\.">
    Require all denied
</DirectoryMatch>

# Deny direct web access to OJS configuration file
<FilesMatch "^config\.inc\.php">
    Require all denied
</FilesMatch>

# ------------------------------------------------------------------------------
# 8. Allowed Hostname, Raw IP Rejection & CloudFront Enforcement
# ------------------------------------------------------------------------------
# Pass environment variables to Apache child processes
PassEnv ALLOWED_HOSTS ALLOWED_HOSTS_PATTERN REQUIRE_CLOUDFRONT BLOCK_RAW_IPS

# Enclose authorization rules inside <Location /> so that Apache 2.4 merges
# them after <Directory /var/www/> and respects "Require all denied".
<Location />
    # Explicit Raw IP Rejection Check:
    # Denies direct connections via raw IPv4 or IPv6 (e.g. 52.205.19.85 or [2001:...])
    # when ALLOWED_HOSTS_PATTERN is defined or BLOCK_RAW_IPS is enabled.
    # Local loopback (127.0.0.1, [::1], localhost) and health checks are exempted.
    <If "(-n '${ALLOWED_HOSTS_PATTERN}' || '${BLOCK_RAW_IPS}' =~ m#^(true|1|yes)$#i) && (%{HTTP_HOST} =~ m#^([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]+)?$# || %{HTTP_HOST} =~ m#^\[[0-9a-fA-F:]+\](:[0-9]+)?$#) && %{HTTP_HOST} !~ m#^(127\.0\.0\.1|\[::1\]|localhost)(:[0-9]+)?$# && %{REQUEST_URI} !~ m#^/(healthz|health-check|ping)/?$#">
        Require all denied
    </If>

    # Enforce Allowed Hostnames:
    # If ALLOWED_HOSTS_PATTERN is defined (non-empty), reject requests whose
    # Host header does not match the allowed pattern with 403 Forbidden.
    # Health check endpoints (/healthz, /health-check, /ping) are exempted.
    <If "-n '${ALLOWED_HOSTS_PATTERN}' && %{HTTP_HOST} !~ m#^(${ALLOWED_HOSTS_PATTERN})(:[0-9]+)?$#i && %{REQUEST_URI} !~ m#^/(healthz|health-check|ping)/?$#">
        Require all denied
    </If>

    # Section 9: CloudFront Distribution Header Enforcement
    # When REQUIRE_CLOUDFRONT=true, ensure that requests arrive through AWS CloudFront
    # (such as an AWS Lightsail Managed Distribution) by verifying the presence of
    # standard headers automatically attached by CloudFront:
    # - X-Amz-Cf-Id (unique CloudFront request ID)
    # - CloudFront-Forwarded-Proto
    # - Via header matching CloudFront
    #
    # If all standard CloudFront headers are absent, direct connections bypassing
    # the distribution are rejected with 403 Forbidden.
    # When REQUIRE_CLOUDFRONT is false or empty, this check is bypassed for local development.
    # Health check endpoints (/healthz, /health-check, /ping) are exempted.
    <If "'${REQUIRE_CLOUDFRONT}' =~ m#^(true|1|yes)$#i && -z req('X-Amz-Cf-Id') && -z req('CloudFront-Forwarded-Proto') && req('Via') !~ m#CloudFront#i && %{REQUEST_URI} !~ m#^/(healthz|health-check|ping)/?$#">
        Require all denied
    </If>
</Location>
