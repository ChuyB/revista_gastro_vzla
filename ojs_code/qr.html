
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ficha Clínica QR</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }
    h1 {
      color: #2c3e50;
    }
    .ficha {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      max-width: 600px;
    }
    p {
      font-size: 18px;
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <div class="ficha">
    <h1>Ficha Clínica</h1>
    <p><strong>Psicólogo:</strong> <span id="psicologo"></span></p>
    <p><strong>Mascota:</strong> <span id="mascota"></span></p>
    <p><strong>Raza:</strong> <span id="raza"></span></p>
    <p><strong>Paciente:</strong> <span id="paciente"></span></p>
    <p><strong>Fecha:</strong> <span id="fecha"></span></p>
  </div>

  <script>
    function getParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key) || 'No especificado';
    }

    document.getElementById("psicologo").textContent = getParam("psicologo");
    document.getElementById("mascota").textContent = getParam("mascota");
    document.getElementById("raza").textContent = getParam("raza");
    document.getElementById("paciente").textContent = getParam("paciente");
    document.getElementById("fecha").textContent = getParam("fecha");
  </script>

</body>
</html>
