<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<style>
        /* Estilo para el botón pequeño */
        #toggleButton {
            padding: 5px 10px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
    <script>
        // Función para ocultar o mostrar el párrafo
        function toggleParagraph() {
            var para = document.getElementById("miParrafo");
            if (para.style.display === "none") {
                para.style.display = "block";
            } else {
                para.style.display = "none";
            }
        }
    </script>
	
	
</head>
<body>

<!-- Botón para ocultar o mostrar el párrafo -->
<button id="toggleButton" onclick="toggleParagraph()">Afiliación de Autores</button>

    <p id="miParrafo" style="display: block;"><font font-family: 'Arial'; font-size: 14.4px;> 
		
		<i>Lesbia I Luzardo-Zschaeck</i><br>
		Profesor Titular, Escuela de Medicina Luis Razetti. Universidad Central de Venezuela.<br><br>
		
	</p>
</body>
</html>
